<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }

        #stack { position: absolute; left: 140px; top: 520px; width: 800px; height: 700px; perspective: 1400px; }
        .lay { position: absolute; left: 0; width: 800px; height: 220px; border-radius: 30px; transform: rotateX(58deg); border: 3px solid rgba(251,252,235,0.35); background: rgba(63,21,33,0.75); }
        .lay.hot { background: #720013; border-color: rgba(251,252,235,0.8); }
        #hd { top: 1280px; }
        #hd .l2 { font-size: 92px; }

      </style>
      <div id="root" data-composition-id="s06-deeper" data-width="1080" data-height="1920">

        <div id="stack">
          <div class="lay" id="L1" style="top:40px"></div>
          <div class="lay" id="L2" style="top:200px"></div>
          <div class="lay" id="L3" style="top:360px"></div>
          <div class="lay hot" id="L4" style="top:520px"></div>
        </div>
        <div id="hd" class="center">
          <div class="mask"><div class="l2" id="d1" data-layout-allow-overlap>THE SYSTEM</div></div>
          <div class="mask"><div class="l2" id="d2" data-layout-allow-overlap>GETS <span class="mark">DEEPER</span></div></div>
        </div>

      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const S = window.SIG, H = window.HFX;
        const T0 = 33.2, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s06-deeper"]';
        const $ = (s) => document.querySelector(scope + ' ' + s);
        const $$ = (s) => Array.from(document.querySelectorAll(scope + ' ' + s));
        const rise = (sel, t, d) => tl.fromTo(sel, { yPercent: 125 }, { yPercent: 0, duration: d || 0.45, ease: "expo.out" }, at(t));
        const fadeUp = (sel, t, d) => tl.fromTo(sel, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: d || 0.4, ease: "power3.out" }, at(t));
        const fadeOut = (sel, t, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at(t));
        const dash = (el) => { const l = el.getTotalLength(); el.style.strokeDasharray = l; el.style.strokeDashoffset = l; return l; };
        const draw = (el, t, d) => { const l = dash(el); tl.fromTo(el, { strokeDashoffset: l }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.inOut" }, at(t)); };
        const line = (svg, d, stroke, w) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke || 'rgba(251,252,235,0.45)');
          p.setAttribute('stroke-width', w || 3); p.setAttribute('stroke-linecap', 'round'); svg.appendChild(p); return p;
        };

        tl.fromTo(["#L1", "#L2", "#L3"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, at(33.25));
        // the camera sinks one layer deeper
        tl.to(["#L1", "#L2", "#L3"], { y: -170, opacity: (i) => 0.3 + i * 0.2, duration: 0.9, ease: "power3.inOut" }, at(33.7));
        tl.fromTo("#L4", { opacity: 0, y: 120 }, { opacity: 1, y: -170, duration: 0.9, ease: "power3.inOut" }, at(33.7));
        rise("#d1", 33.5);
        rise("#d2", 33.75);

        window.__timelines["s06-deeper"] = tl;
      </script>
    </template>
  </body>
</html>
