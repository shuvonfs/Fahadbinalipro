<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        .lbl { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
        .ttl { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
        .ttl .l2 { font-size: 100px; }
        .q { position: absolute; left: 90px; right: 90px; top: 1235px; text-align: center; font-size: 60px; font-weight: 800; line-height: 1.28; }
        #pill { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 960px; height: 76px; padding: 0 34px; border-radius: 38px; background: #80011F; border: 2px solid rgba(251, 252, 235, 0.7); display: flex; align-items: center; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; }
      </style>
      <div id="root" data-composition-id="s08-angles" data-width="1080" data-height="1920">
        <div id="ads"></div>
        <div id="pill">− 30 MIN COMMUTE</div>
        <div id="texts"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const H = window.HFX;
        const T0 = 41.9, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s08-angles"]';
        const $$ = (s) => document.querySelectorAll(scope + ' ' + s);
        const Q = [
          "আপনার next investment কি property হওয়া উচিত?",
          "Family-এর জন্য বড় living space দরকার?",
          "আপনার প্রতিদিনের commute যদি ৩০ মিনিট কমে যায়?",
          "Developer বাছাই করার আগে এই ৩টা জিনিস দেখুন।",
          "Easy payment plan-এ নিজের apartment নেওয়ার সুযোগ।"
        ];
        // measured from the voiceover: [“Creative N”, “X angle”, question start, scene end]
        const W = [
          [41.99, 43.03, 44.38, 47.5],
          [47.58, 48.54, 49.76, 52.55],
          [52.63, 53.62, 54.86, 58.45],
          [58.55, 59.65, 60.76, 64.2],
          [64.31, 65.37, 66.47, null]
        ];
        const texts = document.querySelector(scope + ' #texts');
        const ads = [];
        W.forEach((w, i) => {
          const g = document.createElement('div');
          g.innerHTML = `<div class="lbl l4" id="lb${i}" data-layout-allow-overlap>Creative 0${i + 1} / 05</div>
            <div class="ttl" id="tt${i}" data-layout-allow-overlap><div class="mask"><div class="l2" id="ttw${i}" data-layout-allow-overlap>${H.angles[i].name}</div></div></div>
            <div class="q" id="q${i}" data-layout-allow-overlap>${Q[i]}</div>`;
          texts.appendChild(g);
          ads.push(H.place(document.querySelector(scope + ' #ads'), H.angleAd(i, "a" + i), 540, 830, 0.95));
        });

        W.forEach(([tc, ta, tq, tend], i) => {
          const ad = ads[i];
          // “Creative N” — label + the ad slides in
          tl.fromTo("#lb" + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at(tc) - 0.05);
          tl.fromTo(ad, { opacity: 0, x: 260, rotation: 4 }, { opacity: 1, x: 0, rotation: 0, duration: 0.6, ease: "power3.out" }, at(tc) - 0.05);
          // “X angle” — the angle name lands
          tl.fromTo("#ttw" + i, { yPercent: 125 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, at(ta) - 0.08);
          // question — readable, held until the next creative
          tl.fromTo("#q" + i, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at(tq) - 0.1);
          tl.fromTo(ad, { scale: 0.95 }, { scale: 0.98, duration: (tend || 69.85) - tq, ease: "sine.inOut", immediateRender: false }, at(tq));
          if (tend !== null) {
            tl.to(["#lb" + i, "#tt" + i, "#q" + i], { opacity: 0, y: -18, duration: 0.25, ease: "power2.in" }, at(tend) - 0.2);
            tl.to(ad, { opacity: 0, x: -260, rotation: -4, duration: 0.4, ease: "power2.in" }, at(tend) - 0.2);
          }
        });

        const dash = (el) => { const l = el.getTotalLength(); el.style.strokeDasharray = l; return l; };
        // 1 · investment — trend rises with the angle
        const tr = ads[0].querySelector('.trend'); const trl = dash(tr);
        tl.fromTo(tr, { strokeDashoffset: trl }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, at(43.05));
        tl.fromTo(ads[0].querySelector('.trend-head'), { opacity: 0 }, { opacity: 1, duration: 0.2 }, at(44.2));
        // 2 · family — people settle in, the space opens up
        tl.fromTo(ads[1].querySelectorAll('.people > *'), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.1 }, at(48.6));
        tl.fromTo(ads[1].querySelector('.expand'), { opacity: 0, scaleX: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power3.out" }, at(50.5));
        // 3 · location — home → office route, then the time saved
        const rt = ads[2].querySelector('.route'); const rtl = dash(rt);
        tl.fromTo(ads[2].querySelectorAll('.pin-home, .pin-office'), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.25 }, at(53.65));
        tl.fromTo(rt, { strokeDashoffset: rtl }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, at(54.9));
        tl.fromTo("#pill", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, at(56.2));
        tl.to("#pill", { opacity: 0, duration: 0.25 }, at(58.25));
        // 4 · trust — three checks on “এই ৩টা জিনিস”
        tl.fromTo(ads[3].querySelectorAll('.chk'), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.45 }, at(61.7));
        tl.fromTo(ads[3].querySelector('.seal'), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at(59.7));
        // 5 · offer — the payment plan builds step by step
        tl.fromTo(ads[4].querySelectorAll('.pstep'), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.4 }, at(66.6));
        tl.fromTo(ads[4].querySelector('.key'), { rotation: -18, transformOrigin: "30% 30%" }, { rotation: 0, duration: 0.8, ease: "power3.out" }, at(65.4));
        window.__timelines["s08-angles"] = tl;
      </script>
    </template>
  </body>
</html>
