<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #intro { top: 830px; padding: 0 90px; }
        .chip { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 330px; height: 84px; padding: 0 40px; border-radius: 42px; display: flex; align-items: center; gap: 18px; white-space: nowrap; }
        .chip b { font-size: 30px; font-weight: 800; color: rgba(251, 252, 235, 0.55); }
        .chip span { font-size: 36px; font-weight: 800; letter-spacing: 0.06em; }
        #ring { position: absolute; left: 232px; top: 1074px; width: 616px; height: 142px; border: 4px dashed #FBFCEB; border-radius: 22px; }
        #count { top: 1200px; }
        #notdiv { top: 1190px; }
        #notdiv .l2 { font-size: 92px; }
        #tags { top: 1440px; }
        #dupk { top: 1180px; }
        #dup { top: 1230px; }
        #dup .l1 { font-size: 136px; }
        #dupbar { position: absolute; left: 290px; top: 1400px; width: 500px; height: 12px; border-radius: 6px; background: #80011F; transform-origin: left center; }
      </style>
      <div id="root" data-composition-id="s05-duplicate" data-width="1080" data-height="1920">
        <div id="intro" class="center l3" data-layout-allow-overlap>কিন্তু creative diversification-এর মানে এই না যে—</div>
        <div id="c1" class="chip glass"><b>01</b><span>ONE IMAGE</span></div>
        <div id="c2" class="chip glass"><b>02</b><span>BACKGROUND CHANGE</span></div>
        <div id="c3" class="chip glass"><b>03</b><span>FONT CHANGE</span></div>
        <div id="c4" class="chip glass"><b>04</b><span>COPY × 15</span></div>
        <div id="big"></div>
        <div id="ring"></div>
        <div id="grid"></div>
        <div id="count" class="center" data-layout-allow-overlap><div class="mask"><div class="l2" id="count-w" data-layout-allow-overlap>= 15 ADS</div></div></div>
        <div id="notdiv" class="center" data-layout-allow-overlap>
          <div class="mask"><div class="l2" id="nd1" data-layout-allow-overlap><span class="mark">NOT</span></div></div>
          <div class="mask"><div class="l2" id="nd2" data-layout-allow-overlap>DIVERSIFICATION</div></div>
        </div>
        <div id="tags" class="center l4" data-layout-allow-overlap>Same image · same message · same reason</div>
        <div id="dupk" class="center l4" data-layout-allow-overlap>A beautiful version of</div>
        <div id="dup" class="center" data-layout-allow-overlap><div class="mask"><div class="l1" id="dup-w" data-layout-allow-overlap>DUPLICATION</div></div></div>
        <div id="dupbar"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const H = window.HFX;
        const T0 = 13.45, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s05-duplicate"]';
        const $ = (s) => document.querySelector(scope + ' ' + s);
        const HL = "Your Dream Apartment";
        const V = [
          (u) => H.ad({ photo: H.photos.tower(u), headline: HL, cta: "Book now" }),
          (u) => H.ad({ photo: H.photos.tower(u, true), headline: HL, cta: "Book now", cls: "alt" }),
          (u) => H.ad({ photo: H.photos.tower(u, true), headline: HL, cta: "Book now", cls: "alt serif" })
        ];
        const big = [0, 1, 2].map((k) => H.place($('#big'), V[k]("b" + k), 540, 860, 0.95));
        const grid = [];
        for (let i = 0; i < 15; i++) {
          const c = i % 5, r = Math.floor(i / 5);
          grid.push(H.place($('#grid'), V[(i * 2 + r) % 3]("g" + i), 192 + c * 174, 649 + r * 198, 0.24));
        }

        // "কিন্তু creative diversification-এর মানে এই না যে—" 13.65–16.1
        tl.fromTo("#intro", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at(13.6));
        tl.to("#intro", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, at(16.25));

        // 16.71 "একটা image নিলাম"
        tl.fromTo("#c1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, at(16.6));
        tl.fromTo(big[0], { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 0.95, duration: 0.5, ease: "power3.out" }, at(16.6));
        gsap.set([big[1], big[2]], { clipPath: "inset(0% 100% 0% 0%)" });
        // 17.75 "background change করলাম" — the background wipes to a new colour
        tl.to("#c1", { opacity: 0, duration: 0.2 }, at(17.6));
        tl.fromTo("#c2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, at(17.7));
        tl.to(big[1], { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.inOut" }, at(17.7));
        // 19.1 "font change করলাম" — only the headline typeface changes
        tl.to("#c2", { opacity: 0, duration: 0.2 }, at(18.95));
        tl.fromTo("#c3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, at(19.05));
        tl.to(big[2], { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, at(19.05));
        tl.fromTo("#ring", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, at(19.3));
        tl.to("#ring", { opacity: 0, duration: 0.25 }, at(20.15));
        // 20.3 "আর ১৫টা ad বানিয়ে ফেললাম"
        tl.to("#c3", { opacity: 0, duration: 0.2 }, at(20.2));
        tl.fromTo("#c4", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, at(20.3));
        tl.to(big, { opacity: 0, scale: 0.3, duration: 0.35, ease: "power2.in" }, at(20.25));
        tl.fromTo(grid, { opacity: 0, scale: 0.05 }, { opacity: 1, scale: 0.24, duration: 0.35, ease: "back.out(1.5)", stagger: 0.045 }, at(20.4));
        tl.fromTo("#count-w", { yPercent: 125 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, at(20.95));
        // 22.25 "এটা diversification না।"
        tl.to(["#count-w", "#c4"], { opacity: 0, duration: 0.25 }, at(22.1));
        tl.to(grid, { opacity: 0.4, duration: 0.4 }, at(22.2));
        tl.fromTo("#nd1", { yPercent: 125 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, at(22.25));
        tl.fromTo("#nd2", { yPercent: 125 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, at(22.38));
        tl.fromTo("#tags", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, at(22.75));
        // 24.0 "এটা duplication-এর একটা সুন্দর version।" — collapse into one neat stack
        tl.to(["#nd1", "#nd2"], { yPercent: -125, duration: 0.35, ease: "expo.in" }, at(23.85));
        tl.to("#tags", { opacity: 0, duration: 0.25 }, at(23.85));
        tl.to(grid, {
          x: (i) => 540 - (192 + (i % 5) * 174) + (i - 7) * 3,
          y: (i) => 850 - (649 + Math.floor(i / 5) * 198) + (i - 7) * 3,
          rotation: (i) => (i % 2 ? 1.5 : -1.5) * (i / 15),
          opacity: 1, duration: 0.7, ease: "power3.inOut", stagger: 0.015
        }, at(24.0));
        tl.fromTo("#dupk", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, at(24.3));
        tl.fromTo("#dup-w", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, at(24.45));
        tl.fromTo("#dupbar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, at(25.0));
        window.__timelines["s05-duplicate"] = tl;
      </script>
    </template>
  </body>
</html>
