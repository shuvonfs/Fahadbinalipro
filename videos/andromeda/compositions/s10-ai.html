<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #kick { top: 260px; }
        #head { top: 320px; }
        #head .l2 { font-size: 88px; }
        #net { position: absolute; left: 0; top: 0; }
        .pp { position: absolute; left: 110px; width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .pp svg { width: 58px; height: 58px; }
        #hub { position: absolute; left: 410px; top: 800px; width: 260px; height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #720013; border: 3px solid rgba(251, 252, 235, 0.5); border-radius: 36px; }
        #hub svg { width: 120px; height: 120px; }
        #hub .t { text-align: center; font-size: 26px; font-weight: 800; letter-spacing: 0.12em; line-height: 1.3; }
        #job { top: 1420px; }
        #job .l2 { font-size: 80px; }
      </style>
      <div id="root" data-composition-id="s10-ai" data-width="1080" data-height="1920">
        <div id="kick" class="center l4">AI-driven delivery</div>
        <div id="head" class="center"><div class="mask"><div class="l2" id="head-w">RELEVANCE MATCHING</div></div></div>
        <svg id="net" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="people"></div>
        <div id="hub">
          <svg viewBox="0 0 24 24">
            <circle class="ic" cx="12" cy="12" r="2.6" /><circle class="ic" cx="5" cy="6" r="1.6" /><circle class="ic" cx="19" cy="6" r="1.6" /><circle class="ic" cx="5" cy="18" r="1.6" /><circle class="ic" cx="19" cy="18" r="1.6" />
            <path class="ic" d="M6.3 7l3.7 3.2M17.7 7 14 10.2M6.3 17l3.7-3.2M17.7 17 14 13.8" stroke-width="1.2" />
          </svg>
          <div class="t">DELIVERY<br />SYSTEM</div>
        </div>
        <div id="cards"></div>
        <div id="job" class="center"><div class="mask"><div class="l2" id="job-w">আপনার JOB →</div></div></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const H = window.HFX;
        const T0 = 76.55, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s10-ai"]';
        const NS = 'http://www.w3.org/2000/svg';
        const net = document.querySelector(scope + ' #net');
        const ys = [640, 790, 940, 1090, 1240];
        const perm = [1, 0, 4, 2, 3];
        const people = [], cards = [], base = [], pulse = [];
        const path = (d, stroke, w) => {
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('d', d); p.setAttribute('fill', 'none');
          p.setAttribute('stroke', stroke); p.setAttribute('stroke-width', w);
          p.setAttribute('stroke-linecap', 'round');
          net.appendChild(p);
          return p;
        };
        ys.forEach((y, i) => {
          const pp = document.createElement('div');
          pp.className = 'pp glass';
          pp.style.top = (y - 50) + 'px';
          pp.innerHTML = '<svg viewBox="0 0 24 24"><circle class="ic" cx="12" cy="8.5" r="3.4" /><path class="ic" d="M5.5 19.5c.8-3.3 3.3-5.1 6.5-5.1s5.7 1.8 6.5 5.1" /></svg>';
          document.querySelector(scope + ' #people').appendChild(pp);
          people.push(pp);
          cards.push(H.place(document.querySelector(scope + ' #cards'), H.angleAd(i, "m" + i), 880, y, 0.18));
        });
        ys.forEach((y, i) => {
          const yc = ys[perm[i]];
          const d = `M215 ${y} C 330 ${y}, 330 960, 410 960 M670 960 C 750 960, 750 ${yc}, 820 ${yc}`;
          base.push(path(d, 'rgba(251,252,235,0.16)', 3));
          const pl = path(d, '#FBFCEB', 5);
          const len = pl.getTotalLength();
          pl.style.strokeDasharray = `70 ${len}`;
          pulse.push([pl, len]);
        });

        // "AI-driven delivery system" 76.97 · "relevant creative" 79.13 · "match করতে পারে" 80.89
        tl.fromTo("#kick", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, at(76.9));
        tl.fromTo("#head-w", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, at(77.0));
        tl.fromTo("#hub", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, at(77.5));
        tl.fromTo(people, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.07 }, at(78.0));
        tl.fromTo(base, { opacity: 0 }, { opacity: 1, duration: 0.5 }, at(78.3));
        tl.fromTo(cards, { opacity: 0, scale: 0.06 }, { opacity: 1, scale: 0.18, duration: 0.4, ease: "back.out(1.5)", stagger: 0.08 }, at(79.1));
        tl.to("#hub", { scale: 1.05, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3 }, at(79.6));
        pulse.forEach(([pl, len], i) => {
          const t = at(79.7) + i * 0.3;
          tl.fromTo(pl, { strokeDashoffset: 70, opacity: 1 }, { strokeDashoffset: -len, duration: 0.9, ease: "power1.inOut" }, t);
          tl.to(people[i], { borderColor: "rgba(251,252,235,0.9)", duration: 0.25 }, t);
          tl.to(base[i], { stroke: "rgba(251,252,235,0.55)", duration: 0.3 }, t + 0.5);
        });
        // matched pairs light up on "match"
        tl.to(cards.map((c) => c.querySelector('.fbad')), { borderColor: "rgba(251,252,235,0.95)", duration: 0.3, stagger: 0.1 }, at(80.9));
        // 82.05 "আপনার job তত বেশি হয়ে যাচ্ছে—"
        tl.fromTo("#job-w", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, at(82.15));
        tl.to(["#net", "#people", "#cards", "#hub"], { opacity: 0.35, duration: 0.5 }, at(82.4));
        tl.fromTo("#job-w", { scale: 1 }, { scale: 1.08, duration: 1.4, ease: "sine.inOut" }, at(82.7));
        window.__timelines["s10-ai"] = tl;
      </script>
    </template>
  </body>
</html>
