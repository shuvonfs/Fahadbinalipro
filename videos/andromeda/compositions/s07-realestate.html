<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>

        #spons .sp { font-size: 22px; font-weight: 600; opacity: 0.65; }
        #pin { position: absolute; left: 597px; top: 557px; width: 110px; height: 110px; }
        #title { top: 1160px; }
      </style>
      <div id="root" data-composition-id="s07-realestate" data-width="1080" data-height="1920">
        <div id="chip" class="glass"><span class="l4">Real estate example</span></div>
        <div id="frame"><div id="photo"></div>
          <div id="spons"><div class="av">AP</div><div><div class="nm">Apartment Project</div><div class="sp">Sponsored</div></div></div>
        </div>
        <svg id="pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="#80011F" stroke="#FBFCEB" stroke-width="1.4" /><circle cx="12" cy="10" r="2.6" fill="#FBFCEB" /></svg>
        <div id="title" class="center">
          <div class="mask"><div class="l2" id="t1">APARTMENT</div></div>
          <div class="mask"><div class="l2" id="t2">PROJECT</div></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const H = window.HFX;
        const T0 = 38.85, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s07-realestate"]';
        document.querySelector(scope + ' #photo').innerHTML = H.photos.tower("re");
        const lit = document.querySelectorAll(scope + ' #photo .win.lit');
        // "ধরেন আপনি" 39.23 · "apartment" 40.07 · "project" 40.55 · "promote করছেন" 40.87
        tl.fromTo("#frame", { clipPath: "inset(100% 0% 0% 0% round 36px)" }, { clipPath: "inset(0% 0% 0% 0% round 36px)", duration: 0.8, ease: "power3.inOut" }, at(38.9));
        tl.fromTo("#chip", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at(39.15));
        tl.fromTo(lit, { opacity: 0.1 }, { opacity: 0.85, duration: 0.2, stagger: 0.02 }, at(39.4));
        tl.fromTo("#photo", { scale: 1.12 }, { scale: 1, duration: 3, ease: "power2.out" }, at(38.9));
        tl.fromTo("#t1", { yPercent: 125 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, at(40.02));
        tl.fromTo("#t2", { yPercent: 125 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, at(40.5));
        tl.fromTo("#pin", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, at(40.5));
        tl.fromTo("#spons", { yPercent: -100 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, at(40.85));
        window.__timelines["s07-realestate"] = tl;
      </script>
    </template>
