<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #grid { position: absolute; inset: 0; }
        #q { top: 330px; padding: 0 110px; }
        .hy { position: absolute; left: 110px; width: 860px; height: 116px; border-radius: 24px; display: flex; align-items: center; padding: 0 34px; gap: 26px; }
        .hy svg { width: 54px; height: 54px; flex: none; }
        .hy b { font-size: 32px; font-weight: 800; letter-spacing: 0.06em; }
        .hy em { margin-left: auto; font-style: normal; font-size: 30px; font-weight: 600; color: rgba(251, 252, 235, 0.7); }
        #rule { top: 1310px; }
        .rl1 { font-size: 54px; font-weight: 800; }
        .rl2 { font-size: 54px; font-weight: 600; color: rgba(251, 252, 235, 0.6); }
      </style>
      <div id="root" data-composition-id="s14-hypothesis" data-width="1080" data-height="1920">
        <div id="grid"></div>
        <div id="q" class="center l3">কতগুলো meaningful hypothesis আছে?</div>
        <div id="hys"></div>
        <div id="rule" class="center">
          <div class="mask"><div class="rl1" id="r1">QUALITY OF HYPOTHESES</div></div>
          <div class="mask"><div class="rl2" id="r2">&gt; NUMBER OF ADS</div></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="s14-hypothesis"]';
        const PHOTO = '<div class="hd"></div><div class="hl"></div><div class="img"></div><div class="t1"></div><div class="t2"></div><div class="cta"></div>';
        // the 30 duplicated cards from the previous beat
        const grid = [];
        for (let i = 0; i < 30; i++) {
          const c = document.createElement('div');
          c.className = 'ad';
          c.innerHTML = PHOTO;
          c.style.left = (210 + (i % 6) * 114) + 'px';
          c.style.top = (640 + Math.floor(i / 6) * 144) + 'px';
          document.querySelector(scope + ' #grid').appendChild(c);
          grid.push(c);
        }
        gsap.set(grid, { scale: 0.3, transformOrigin: '0 0' });
        const ROWS = [
          ["Investment", '<path class="ic" d="M4 18l5-5 4 3 7-8M15 8h5v5" />'],
          ["Family", '<path class="ic" d="M4 11l8-6.5L20 11M6 9.5V20h12V9.5M10 20v-5h4v5" />'],
          ["Location", '<path class="ic" d="M12 21s6.5-5.8 6.5-11a6.5 6.5 0 1 0-13 0c0 5.2 6.5 11 6.5 11z" /><circle class="ic" cx="12" cy="10" r="2.3" />'],
          ["Trust", '<path class="ic" d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z" /><path class="ic" d="M8.8 12.2l2.2 2.2 4.2-4.4" />'],
          ["Offer", '<rect class="ic" x="3" y="6" width="18" height="12" rx="2" /><path class="ic" d="M3 10h18M7 14.5h4" />']
        ];
        const rows = ROWS.map(([name, icon], i) => {
          const r = document.createElement('div');
          r.className = 'hy glass';
          r.style.top = (580 + i * 140) + 'px';
          r.innerHTML = '<svg viewBox="0 0 24 24">' + icon + '</svg><b>HYPOTHESIS 0' + (i + 1) + '</b><em>' + name + '</em>';
          document.querySelector(scope + ' #hys').appendChild(r);
          return r;
        });

        // local = global − 97.45 ; question 97.61–99.47
        tl.fromTo(grid, { opacity: 0.1 }, {
          opacity: 0, y: (i) => (580 + Math.floor(i / 6) * 140 + 30) - (640 + Math.floor(i / 6) * 144),
          x: (i) => 480 - (210 + (i % 6) * 114), duration: 0.55, ease: "power3.in", stagger: 0.008
        }, 0.0);
        tl.fromTo("#q", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.15);
        tl.fromTo(rows, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.17 }, 0.45);
        // 99.3 — the principle
        tl.fromTo("#r1", { yPercent: 125 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, 1.7);
        tl.fromTo("#r2", { yPercent: 125 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, 1.9);
        window.__timelines["s14-hypothesis"] = tl;
      </script>
    </template>
  </body>
</html>
