    <template>

        #sA { top: 1430px; }
        #sB { top: 1420px; }
        .sub { font-size: 44px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.25; }
      </style>
      <div id="root" data-composition-id="s09-same" data-width="1080" data-height="1920">
        <svg id="wires" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="core" class="glass">
          <svg id="ico-b" viewBox="0 0 24 24"><path class="ic" d="M5 21V6l7-3v18M12 9l7 2.5V21M3 21h18M8 8.5h1.5M8 12h1.5M8 15.5h1.5M15 14h1.5M15 17h1.5" /></svg>
          <svg id="ico-p" viewBox="0 0 24 24"><circle class="ic" cx="12" cy="8" r="3.6" /><path class="ic" d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6" /></svg>
        </div>
        <div id="r1" class="rc glass" style="left:435px; top:525px"><svg viewBox="0 0 24 24"><path class="ic" d="M4 18l5-5 4 3 7-8M15 8h5v5" /></svg><span>INVESTMENT</span></div>
        <div id="r2" class="rc glass" style="left:725px; top:785px"><svg viewBox="0 0 24 24"><path class="ic" d="M4 11l8-6.5L20 11M6 9.5V20h12V9.5M10 20v-5h4v5" /></svg><span>FAMILY</span></div>
        <div id="r3" class="rc glass" style="left:615px; top:1195px"><svg viewBox="0 0 24 24"><path class="ic" d="M12 21s6.5-5.8 6.5-11a6.5 6.5 0 1 0-13 0c0 5.2 6.5 11 6.5 11z" /><circle class="ic" cx="12" cy="10" r="2.3" /></svg><span>LOCATION</span></div>
        <div id="r4" class="rc glass" style="left:255px; top:1195px"><svg viewBox="0 0 24 24"><path class="ic" d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z" /><path class="ic" d="M8.8 12.2l2.2 2.2 4.2-4.4" /></svg><span>TRUST</span></div>
        <div id="r5" class="rc glass" style="left:145px; top:785px"><svg viewBox="0 0 24 24"><rect class="ic" x="3" y="6" width="18" height="12" rx="2" /><path class="ic" d="M3 10h18M7 14.5h4" /></svg><span>OFFER</span></div>
        <div id="hA" data-layout-allow-overlap class="center"><div class="mask"><div class="l2" id="hA-w" data-layout-allow-overlap>SAME PRODUCT</div></div></div>
        <div id="hB" data-layout-allow-overlap class="center">
          <div class="mask"><div class="l2" id="hB1" data-layout-allow-overlap>NOT THE SAME</div></div>
          <div class="mask"><div class="l2" id="hB2" data-layout-allow-overlap><span class="mark">REASON</span></div></div>
        </div>
        <div id="sA" data-layout-allow-overlap class="center"><div class="mask"><div class="sub" id="sA-w" data-layout-allow-overlap>5 DIFFERENT REASONS TO CARE</div></div></div>
        <div id="sB" data-layout-allow-overlap class="center sub">
          <div class="mask"><div id="sB1" data-layout-allow-overlap>DIFFERENT CREATIVE</div></div>
          <div class="mask"><div id="sB2" data-layout-allow-overlap>→ DIFFERENT MOTIVATION</div></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="s09-same"]';
        const svg = document.querySelector(scope + ' #wires');
        const ends = [[540, 675], [725, 889], [679, 1195], [401, 1195], [355, 889]];
        const wires = ends.map(([x, y]) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          const dx = x - 540, dy = y - 940, d0 = Math.hypot(dx, dy);
          p.setAttribute('d', `M${540 + dx / d0 * 132} ${940 + dy / d0 * 132} L${x} ${y}`);
          p.setAttribute('stroke', 'rgba(251,252,235,0.35)');
          p.setAttribute('stroke-width', '3');
          p.setAttribute('fill', 'none');
          svg.appendChild(p);
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          return [p, len];
        });
        const cards = ["#r1", "#r2", "#r3", "#r4", "#r5"];
        const from = [[0, -300], [400, 0], [300, 300], [-300, 300], [-400, 0]];

        // local = global − 69.55
        tl.fromTo("#core", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 0.3);
        tl.set("#ico-p", { opacity: 0 }, 0);
        cards.forEach((c, i) => {
          tl.fromTo(c, { opacity: 0, x: from[i][0], y: from[i][1] }, { opacity: 1, x: 0, y: 0, duration: 0.7, ease: "power3.out" }, 0.4 + i * 0.07);
          tl.fromTo(wires[i][0], { strokeDashoffset: wires[i][1] }, { strokeDashoffset: 0, duration: 0.4 }, 0.9 + i * 0.07);
        });
        tl.fromTo("#hA-w", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 0.5);
        tl.fromTo("#sA-w", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 1.4);
        // 72.40 "কিন্তু সবগুলো একই মানুষকে" — the product becomes a person
        tl.to(["#hA-w", "#sA-w"], { yPercent: -125, duration: 0.4, ease: "expo.in" }, 2.7);
        tl.to("#ico-b", { opacity: 0, scale: 0.8, duration: 0.4 }, 2.85);
        tl.fromTo("#ico-p", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 3.0);
        // each creative pulls on a different motivation, one at a time
        cards.forEach((c, i) => {
          const t = 3.2 + i * 0.32;
          tl.to(wires[i][0], { stroke: "rgba(251,252,235,0.9)", strokeWidth: 5, duration: 0.2 }, t);
          tl.to(c, { borderColor: "rgba(251,252,235,0.8)", scale: 1.06, duration: 0.2 }, t);
          tl.to(c, { scale: 1, duration: 0.3 }, t + 0.25);
        });
        // 74.48 "একই reason-এ convince করছে না।"
        tl.fromTo("#hB1", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 4.85);
        tl.fromTo("#hB2", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 5.0);
        tl.fromTo("#sB1", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 5.4);
        tl.fromTo("#sB2", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 5.55);
        window.__timelines["s09-same"] = tl;
      </script>
    </template>
