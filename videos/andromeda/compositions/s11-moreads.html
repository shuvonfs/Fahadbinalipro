<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #ghost { position: absolute; inset: 0; }
        #blk { position: absolute; left: 0; right: 0; top: 740px; height: 200px; }
        #more { text-align: center; }
        #strike { position: absolute; left: 150px; top: 82px; width: 780px; height: 20px; border-radius: 10px; background: #80011F; box-shadow: 0 0 0 3px rgba(251, 252, 235, 0.85); transform-origin: left center; }
        #notjob { top: 990px; }
        #borong { top: 860px; }
      </style>
      <div id="root" data-composition-id="s11-moreads" data-width="1080" data-height="1920">
        <div id="ghost"></div>
        <div id="blk" data-layout-allow-overlap>
          <div class="mask"><div class="l1" id="more">MORE ADS</div></div>
          <div id="strike"></div>
        </div>
        <div id="notjob" data-layout-allow-overlap class="center l4">is not the job</div>
        <div id="borong" data-layout-allow-overlap class="center"><div class="mask"><div class="l1" id="borong-w">বরং—</div></div></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="s11-moreads"]';
        const spots = [[120, 380], [660, 380], [-40, 760], [820, 760], [120, 1150], [660, 1150], [390, 300], [390, 1250]];
        const ghost = spots.map(([x, y]) => {
          const c = document.createElement('div');
          c.className = 'ad';
          c.innerHTML = '<div class="hd"></div><div class="hl"></div><div class="img"></div><div class="t1"></div><div class="t2"></div><div class="cta"></div>';
          c.style.left = x + 'px'; c.style.top = y + 'px';
          document.querySelector(scope + ' #ghost').appendChild(c);
          return c;
        });
        gsap.set(ghost, { scale: 0.7 });

        // local = global − 81.9 ; "More ads" 82.06
        tl.fromTo(ghost, { opacity: 0 }, { opacity: 0.16, duration: 0.3, stagger: 0.06 }, 0.1);
        tl.fromTo("#more", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 0.1);
        // 82.85 "বানানো না।" — cross it out, quietly
        tl.fromTo("#strike", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 0.9);
        tl.to("#more", { opacity: 0.4, duration: 0.4 }, 1.25);
        tl.to(ghost, { opacity: 0, duration: 0.5 }, 1.2);
        tl.fromTo("#notjob", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 1.2);
        // 84.34 "বরং—"
        tl.to("#blk", { y: -260, scale: 0.6, opacity: 0.35, duration: 0.6, ease: "power3.inOut" }, 2.3);
        tl.to("#notjob", { opacity: 0, duration: 0.3 }, 2.3);
        tl.fromTo("#borong-w", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 2.45);
        tl.to(["#blk", "#borong-w"], { opacity: 0, duration: 0.3 }, 4.05);
        window.__timelines["s11-moreads"] = tl;
      </script>
    </template>
  </body>
</html>
