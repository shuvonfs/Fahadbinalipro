      <script>
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="s06-framework"]';
        const svg = document.querySelector(scope + ' #wires');
        const ends = [[540, 658], [713, 830], [663, 1142], [417, 1142], [367, 830]];
        const wires = ends.map(([x, y]) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');

          p.setAttribute('stroke', 'rgba(251,252,235,0.4)');

          p.setAttribute('fill', 'none');
          svg.appendChild(p);

        // local = global − 29.15
        tl.fromTo("#h1", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 0.15);
        tl.fromTo("#h2", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 0.3);

        tl.to("#head", { y: -540, scale: 0.6, duration: 0.8, ease: "power3.inOut" }, 3.3);
        tl.fromTo("#hub", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 3.75);
        // five branches on the spoken words
        const beats = [6.35, 8.22, 10.05, 11.2, 12.85];
        beats.forEach((t, i) => {
          const [p, len] = wires[i];
          tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, t - 0.1);
          tl.fromTo("#a" + (i + 1), { opacity: 0, scale: 0.8, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, t);
        });
        // 44.43 "থেকে creative তৈরি করা।" — the system lights up into output
        tl.to(["#a1", "#a2", "#a3", "#a4", "#a5"], { borderColor: "rgba(251,252,235,0.75)", duration: 0.3, stagger: 0.08 }, 15.2);
        wires.forEach(([p]) => tl.to(p, { stroke: "rgba(251,252,235,0.8)", duration: 0.3 }, 15.2));
        tl.fromTo("#out-w", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 15.35);
        window.__timelines["s06-framework"] = tl;
