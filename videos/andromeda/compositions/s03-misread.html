<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #laptop { position: absolute; left: 140px; top: 430px; width: 800px; height: 560px; }
        #tiles { position: absolute; left: 210px; top: 478px; width: 660px; height: 396px; }
        .tile { position: absolute; width: 140px; height: 110px; border-radius: 10px; background: #3F1521; border: 2px solid rgba(251, 252, 235, 0.25); overflow: hidden; }
        .tile b { position: absolute; left: 0; right: 0; top: 0; height: 64px; background: linear-gradient(140deg, #80011F, #2D0001); }
        .tile i { position: absolute; left: 12px; top: 76px; width: 90px; height: 10px; border-radius: 5px; background: rgba(251, 252, 235, 0.55); }
        #qb { position: absolute; left: 760px; top: 340px; width: 170px; height: 150px; }
        #kick { top: 1090px; }
        #mis { top: 1150px; }
        #warn { position: absolute; left: 490px; top: 1290px; width: 100px; height: 100px; }
      </style>
      <div id="root" data-composition-id="s03-misread" data-width="1080" data-height="1920">
        <svg id="laptop" viewBox="0 0 800 560">
          <rect x="60" y="20" width="680" height="440" rx="22" fill="#2D0001" stroke="#FBFCEB" stroke-opacity=".6" stroke-width="4" />
          <path d="M0 480h800l-40 50H40z" fill="#3F1521" stroke="#FBFCEB" stroke-opacity=".6" stroke-width="4" />
          <path d="M330 480h140" stroke="#FBFCEB" stroke-opacity=".5" stroke-width="6" stroke-linecap="round" />
        </svg>
        <div id="tiles"></div>
        <svg id="qb" viewBox="0 0 170 150"><path d="M10 10h150v100H70l-40 30v-30H10z" fill="#80011F" stroke="#FBFCEB" stroke-width="4" stroke-linejoin="round" /><text x="85" y="88" text-anchor="middle" font-size="72" font-weight="800" fill="#FBFCEB">?</text></svg>
        <div id="kick" class="center l4">Many marketers are</div>
        <div id="mis" class="center"><div class="mask"><div id="mis-w" class="l2" style="font-size:92px">MISUNDERSTANDING</div></div></div>
        <svg id="warn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#80011F" /><path d="M12 7v6" stroke="#FBFCEB" stroke-width="2.2" stroke-linecap="round" /><circle cx="12" cy="16.6" r="1.2" fill="#FBFCEB" /></svg>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const T0 = 5.2, at = (g) => +(g - T0).toFixed(3);
        const box = document.querySelector('[data-composition-id="s03-misread"] #tiles');
        const tiles = [];
        for (let i = 0; i < 12; i++) {
          const t = document.createElement('div');
          t.className = 'tile';
          t.innerHTML = '<b></b><i></i>';
          t.style.left = (20 + (i % 4) * 160) + 'px';
          t.style.top = (14 + Math.floor(i / 4) * 128) + 'px';
          box.appendChild(t);
          tiles.push(t);
        }
        // "আর এখানেই" 5.29 · "অনেক marketer" ≈5.9 · "ভুল বুঝছে" ≈6.6–7.5
        tl.fromTo("#laptop", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at(5.25));
        tl.fromTo(tiles, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)", stagger: 0.05 }, at(5.45));
        tl.fromTo("#kick", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at(5.85));
        tl.fromTo("#mis-w", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, at(6.5));
        tl.fromTo("#qb", { opacity: 0, scale: 0.5, transformOrigin: "20% 100%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, at(6.6));
        tl.fromTo("#warn", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, at(6.95));
        tl.to(tiles, { opacity: 0.35, duration: 0.5 }, at(7.0));
        window.__timelines["s03-misread"] = tl;
      </script>
    </template>
  </body>
</html>
