<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #wires { position: absolute; left: 0; top: 0; }
        #node { position: absolute; left: 420px; top: 690px; width: 240px; height: 240px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        #node svg { width: 84px; height: 84px; }
        #node .lbl { font-size: 26px; font-weight: 600; letter-spacing: 0.16em; }
        #kick { top: 230px; }
        #title { top: 1250px; }
      </style>
      <div id="root" data-composition-id="s04-diversify" data-width="1080" data-height="1920">
        <svg id="wires" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="cards"></div>
        <div id="node" class="glass">
          <svg viewBox="0 0 24 24"><path class="ic" d="M4 8l8-4 8 4v8l-8 4-8-4z" /><path class="ic" d="M4 8l8 4 8-4M12 12v8" /></svg>
          <div class="lbl">1 CAMPAIGN</div>
        </div>
        <div id="kick" class="center l4">Meta · current direction</div>
        <div id="title" class="center">
          <div class="mask"><div class="l2" id="t1">CREATIVE</div></div>
          <div class="mask"><div class="l2" id="t2">DIVERSIFICATION</div></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="s04-diversify"]';
        const AD = {
          photo: '<div class="hd"></div><div class="hl"></div><div class="img"></div><div class="t1"></div><div class="t2"></div><div class="cta"></div>',
          type: '<div class="hd"></div><div class="hl"></div><div class="big" style="top:110px;width:240px"></div><div class="big" style="top:160px;width:200px"></div><div class="big" style="top:210px;width:140px"></div><div class="t2" style="top:300px"></div><div class="cta"></div>',
          quote: '<div class="qm">&ldquo;</div><div class="t1" style="top:200px"></div><div class="t1" style="top:232px;width:190px"></div><div class="t2" style="top:276px"></div><div class="hd" style="top:330px"></div><div class="hl" style="top:342px"></div>',
          chart: '<div class="hd"></div><div class="hl"></div><div class="img" style="background:#2D0001"></div><div class="bar" style="left:50px;height:50px"></div><div class="bar" style="left:110px;height:85px"></div><div class="bar" style="left:170px;height:120px"></div><div class="bar" style="left:230px;height:160px;background:#80011F"></div><div class="t1"></div><div class="t2"></div>',
          ugc: '<div class="img" style="top:0;height:290px;background:linear-gradient(160deg,#3F1521,#720013)"></div><div class="av"></div><div class="play"></div><div class="t1"></div><div class="t2"></div>'
        };
        const spots = [["photo", 230, 520], ["type", 540, 455], ["quote", 850, 520], ["chart", 220, 1020], ["ugc", 860, 1020]];
        const box = document.querySelector(scope + ' #cards');
        const svg = document.querySelector(scope + ' #wires');
        const cx = 540, cy = 810;
        const cards = [], wires = [];
        spots.forEach(([v, x, y]) => {
          const c = document.createElement('div');
          c.className = 'ad' + (v === 'type' ? ' v-type' : v === 'quote' ? ' v-quote' : '');
          c.innerHTML = AD[v];
          c.style.left = (x - 150) + 'px';
          c.style.top = (y - 200) + 'px';
          box.appendChild(c);
          cards.push(c);
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', `M${cx} ${cy} C ${cx} ${(cy + y) / 2}, ${x} ${(cy + y) / 2}, ${x} ${y}`);
          p.setAttribute('fill', 'none');
          p.setAttribute('stroke', 'rgba(251,252,235,0.35)');
          p.setAttribute('stroke-width', '3');
          svg.appendChild(p);
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          wires.push([p, len]);
        });
        gsap.set(cards, { scale: 0.62 });

        // local = global − 8.4
        tl.fromTo("#kick", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        tl.fromTo("#node", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.35);
        // "creative diversification" ≈ 10.7 → branches grow out
        wires.forEach(([p, len], i) => {
          tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 2.2 + i * 0.12);
        });
        tl.fromTo(cards, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 0.62, duration: 0.55, ease: "back.out(1.5)", stagger: 0.12 }, 2.5);
        tl.fromTo("#t1", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 2.6);
        tl.fromTo("#t2", { yPercent: 125 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 2.75);
        // "গুরুত্বপূর্ণ" — gentle settle, the system breathes
        tl.to(cards, { y: (i) => (i % 2 ? -12 : 12), duration: 1.6, ease: "sine.inOut" }, 3.4);
        tl.to("#node", { scale: 1.05, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.4);
        window.__timelines["s04-diversify"] = tl;
      </script>
    </template>
  </body>
</html>
