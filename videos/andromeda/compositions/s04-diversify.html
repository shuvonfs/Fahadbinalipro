<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #wires { position: absolute; left: 0; top: 0; }
        #node { position: absolute; left: 410px; top: 700px; width: 260px; height: 260px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #720013; border: 3px solid rgba(251, 252, 235, 0.55); }
        #node svg { width: 92px; height: 92px; }
        #node .lbl { font-size: 26px; font-weight: 800; letter-spacing: 0.14em; }
        #kick { top: 220px; }
        #title { top: 1250px; }
        #imp { top: 1475px; }
        #imp span { font-size: 54px; font-weight: 800; }
      </style>
      <div id="root" data-composition-id="s04-diversify" data-width="1080" data-height="1920">
        <svg id="wires" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="cards"></div>
        <div id="node">
          <svg viewBox="0 0 24 24"><path class="ic" d="M5 21V6l7-3v18M12 9l7 2.5V21M3 21h18M8 8.5h1.5M8 12h1.5M8 15.5h1.5M15 14h1.5M15 17h1.5" /></svg>
          <div class="lbl">1 PRODUCT</div>
        </div>
        <div id="kick" class="center l4">Meta · advertising direction</div>
        <div id="title" class="center">
          <div class="mask"><div class="l2" id="t1">CREATIVE</div></div>
          <div class="mask"><div class="l2" id="t2">DIVERSIFICATION</div></div>
        </div>
        <div id="imp" class="center"><div class="mask"><div id="imp-w"><span class="mark">গুরুত্বপূর্ণ</span></div></div></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const H = window.HFX;
        const T0 = 8.35, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s04-diversify"]';
        const box = document.querySelector(scope + ' #cards');
        const svg = document.querySelector(scope + ' #wires');
        const spots = [[200, 540], [540, 440], [880, 540], [190, 1060], [890, 1060]];
        const cx = 540, cy = 830;
        const cards = [], wires = [];
        spots.forEach(([x, y], i) => {
          cards.push(H.place(box, H.angleAd(i, "d" + i), x, y, 0.36));
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', `M${cx} ${cy} C ${cx} ${(cy + y) / 2}, ${x} ${(cy + y) / 2}, ${x} ${y}`);
          p.setAttribute('fill', 'none');
          p.setAttribute('stroke', 'rgba(251,252,235,0.4)');
          p.setAttribute('stroke-width', '3');
          svg.appendChild(p);
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          wires.push([p, len]);
        });
        // "Meta" 8.57 · "creative diversification" 10.65–11.85 · "গুরুত্বপূর্ণ" 11.89
        tl.fromTo("#kick", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at(8.5));
        tl.fromTo("#node", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, at(8.75));
        wires.forEach(([p, len], i) => {
          tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, at(10.5) + i * 0.1);
        });
        tl.fromTo(cards, { opacity: 0, scale: 0.15 }, { opacity: 1, scale: 0.36, duration: 0.5, ease: "back.out(1.4)", stagger: 0.1 }, at(10.65));
        tl.fromTo("#t1", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, at(10.65));
        tl.fromTo("#t2", { yPercent: 125 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, at(10.85));
        tl.fromTo("#imp-w", { yPercent: 125 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, at(11.85));
        tl.to(cards, { y: (i) => (i % 2 ? -10 : 10), duration: 1.3, ease: "sine.inOut" }, at(12.0));
        window.__timelines["s04-diversify"] = tl;
      </script>
    </template>
  </body>
</html>
