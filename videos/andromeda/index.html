      * { margin: 0; padding: 0; box-sizing: border-box; }

      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        font-family: "Anek Bangla", sans-serif;
        color: #FBFCEB;
        background: linear-gradient(170deg, #3F1521 0%, #2D0001 55%, #2D0001 100%);

      #bg-glow {
        position: absolute; width: 1600px; height: 1600px; left: -260px; top: -300px;

      #bg-glow-2 {
        position: absolute; width: 1400px; height: 1400px; left: -160px; top: 900px;

      #bg-vignette {

      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }

      /* ---------- shared design system (used by every scene) ---------- */
      .l1 { font-weight: 800; font-size: 168px; line-height: 1.02; letter-spacing: -0.02em; }
      .l2 { font-weight: 800; font-size: 96px; line-height: 1.05; letter-spacing: -0.01em; }

      .mark { display: inline-block; background: #80011F; border-radius: 14px; padding: 0.06em 0.16em 0; line-height: 1; }
      .mask { overflow: hidden; display: block; }
      .center { position: absolute; left: 0; right: 0; text-align: center; }

      .glass {
        background: linear-gradient(155deg, rgba(251, 252, 235, 0.11) 0%, rgba(251, 252, 235, 0.03) 45%, rgba(63, 21, 33, 0.35) 100%);
        border: 2px solid rgba(251, 252, 235, 0.2);
        border-radius: 32px;
        box-shadow: inset 0 2px 0 rgba(251, 252, 235, 0.12), 0 24px 60px rgba(20, 0, 0, 0.45);
      }
      .ic { fill: none; stroke: #FBFCEB; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ic-accent { fill: none; stroke: #80011F; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

      /* Ad-card: a generic social ad creative silhouette */
      .ad { position: absolute; width: 300px; height: 400px; border-radius: 26px; overflow: hidden;

      .ad .cta { position: absolute; right: 22px; bottom: 22px; width: 70px; height: 26px; border-radius: 13px; background: #FBFCEB; }
      /* distinct creative formats */
      .ad.v-type { background: #720013; }
      .ad .big { position: absolute; left: 26px; height: 34px; border-radius: 8px; background: #FBFCEB; }
      .ad.v-quote { background: #2D0001; }
      .ad .qm { position: absolute; left: 22px; top: 70px; font-size: 150px; line-height: 1; font-weight: 800; color: #80011F; }
      .ad .bar { position: absolute; bottom: 118px; width: 36px; border-radius: 6px 6px 0 0; background: #FBFCEB; }
      .ad .av { position: absolute; left: 90px; top: 96px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(251, 252, 235, 0.8); background: #80011F; }
      .ad .play { position: absolute; left: 128px; top: 232px; width: 0; height: 0; border-left: 36px solid #FBFCEB; border-top: 22px solid transparent; border-bottom: 22px solid transparent; }
      /* ---------- social-feed ad mockup (native 640 × 740) ---------- */
      .fbad { position: absolute; width: 640px; height: 740px; border-radius: 34px; overflow: hidden; background: #3F1521;
        border: 2px solid rgba(251, 252, 235, 0.22); box-shadow: 0 30px 80px rgba(20, 0, 0, 0.55); color: #FBFCEB; }
      .fbad .fb-h { height: 100px; display: flex; align-items: center; gap: 18px; padding: 0 28px; }
      .fbad .fb-av { width: 60px; height: 60px; border-radius: 50%; background: #80011F; border: 2px solid rgba(251, 252, 235, 0.6); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
      .fbad .fb-nm { font-size: 26px; font-weight: 800; line-height: 1.2; }
      .fbad .fb-sp { font-size: 20px; font-weight: 600; opacity: 0.6; display: flex; align-items: center; gap: 6px; }
      .fbad .fb-dots { margin-left: auto; font-size: 30px; opacity: 0.6; }
      .fbad .fb-tx { height: 60px; padding: 0 28px; }
      .fbad .fb-tx i { display: block; height: 12px; border-radius: 6px; background: rgba(251, 252, 235, 0.35); margin-bottom: 12px; }
      .fbad .fb-img { position: relative; width: 640px; height: 440px; overflow: hidden; background: #2D0001; }
      .fbad .fb-f { height: 140px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; background: rgba(45, 0, 1, 0.55); }
      .fbad .fb-dm { font-size: 17px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.55; }
      .fbad .fb-hl { font-size: 34px; font-weight: 800; line-height: 1.15; margin-top: 4px; }
      .fbad .fb-cta { flex: none; height: 58px; padding: 0 26px; border-radius: 14px; background: rgba(251, 252, 235, 0.16); display: flex; align-items: center; font-size: 22px; font-weight: 800; }
      .fbad.serif .fb-hl { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 38px; letter-spacing: 0; }
      .fbad.alt { background: #720013; }
      .fbad.alt .fb-f { background: rgba(251, 252, 235, 0.08); }
