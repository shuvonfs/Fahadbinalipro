      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Sans Bengali"; font-weight: 400; src: url("assets/fonts/noto-sans-bengali-bengali-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Sans Bengali"; font-weight: 600; src: url("assets/fonts/noto-sans-bengali-bengali-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Sans Bengali"; font-weight: 800; src: url("assets/fonts/noto-sans-bengali-bengali-800-normal.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FBFCEB; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", "Noto Sans Bengali", sans-serif; color: #2D0001; background: #FBFCEB; }
      #grid { position: absolute; inset: -120px; opacity: 1;
        background-image: linear-gradient(rgba(114,0,19,0.045) 2px, transparent 2px), linear-gradient(90deg, rgba(114,0,19,0.045) 2px, transparent 2px);
        background-size: 90px 90px; }
      #warm { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(251,252,235,0) 40%, rgba(240,232,214,0.55) 100%); }
      #glow { position: absolute; width: 1400px; height: 1400px; left: -160px; top: 300px; background: radial-gradient(circle, rgba(128,1,31,0.07) 0%, rgba(128,1,31,0) 62%); }
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }

      /* ---------- type ---------- */
      .h1 { font-weight: 800; font-size: 150px; line-height: 1.02; letter-spacing: -0.035em; color: #2D0001; }
      .h2 { font-weight: 800; font-size: 92px; line-height: 1.06; letter-spacing: -0.025em; color: #2D0001; }
      .h3 { font-weight: 600; font-size: 54px; line-height: 1.3; color: #3F1521; }
      .bn { font-family: "Noto Sans Bengali", "Inter", sans-serif; }
      .lab { font-weight: 600; font-size: 26px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(63,21,33,0.68); }
      .acc { color: #80011F; }
      .mark { display: inline-block; background: #80011F; color: #FBFCEB; border-radius: 14px; padding: 0.06em 0.16em 0; line-height: 1; }
      .mask { overflow: hidden; display: block; }
      .center { position: absolute; left: 0; right: 0; text-align: center; }

      /* ---------- glass + components ---------- */
      .glass { background: linear-gradient(160deg, rgba(255,255,255,0.82), rgba(255,255,255,0.5)); border: 2px solid rgba(114,0,19,0.14);
        border-radius: 28px; box-shadow: 0 24px 60px rgba(45,0,1,0.08), inset 0 2px 0 rgba(255,255,255,0.95); }
      .ic { fill: none; stroke: #720013; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ico { display: block; flex: none; }
      .node { display: inline-flex; align-items: center; gap: 14px; height: 88px; padding: 0 28px; white-space: nowrap; font-size: 30px; font-weight: 800; letter-spacing: 0.04em; color: #2D0001; border-radius: 22px; }
      .node.hot { background: #720013; border-color: #720013; color: #FBFCEB; box-shadow: 0 24px 60px rgba(114,0,19,0.25); }
      .node.hot .ic { stroke: #FBFCEB; }
      .node.sm { height: 64px; padding: 0 18px; font-size: 22px; gap: 10px; border-radius: 16px; }
      .pill { display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 26px; border-radius: 32px; background: #720013; color: #FBFCEB; font-size: 24px; font-weight: 800; letter-spacing: 0.12em; white-space: nowrap; }
      .pill .ic { stroke: #FBFCEB; }
      .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(114,0,19,0.22); }
    </style>
