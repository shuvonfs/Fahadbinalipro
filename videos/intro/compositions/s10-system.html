<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }

        #ttl { top: 250px; }
        #ttl .h2 { color: #720013; }
        #orb { position: absolute; left: 0; top: 0; }

      </style>
      <div id="root" data-composition-id="s10-system" data-width="1080" data-height="1920">

        <div id="ttl" class="center"><div class="mask"><div class="h2" id="t1" data-layout-allow-overlap>GROWTH SYSTEM</div></div></div>
        <svg id="orb" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="flow"></div>

      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const K = window.KIT;
        const C = {"notAds": 2.0, "growth": 4.6, "strategy": 6.6, "audience": 7.4, "creative": 8.2, "data": 8.9, "funnel": 9.5, "decision": 11.0, "fahad": 13.0, "years": 15.0, "realEstate": 16.4, "studyAbroad": 17.5, "localIntl": 19.3, "service": 21.4, "brands": 24.0, "inhouse": 27.2, "agency": 28.4, "environment": 29.8, "focus": 32.3, "leadGen": 34.3, "dekhte": 36.6, "source": 37.6, "valuable": 39.4, "leakage": 41.8, "improve": 44.2, "revenue": 46.6, "campaign": 49.6, "business": 51.6, "notTrue": 53.6, "today": 56.0, "dataDriven": 57.6, "aiPowered": 58.6, "connected": 59.6, "advertising": 61.6, "marketing": 63.0, "growthSystem": 65.2, "reStudy": 68.2, "service2": 70.6, "platform": 73.0, "metaAds": 74.6, "googleAds": 75.3, "ai": 76.0, "automation": 76.6, "funnel2": 77.4, "data2": 78.0, "bizGrowth": 78.7, "experience": 80.0, "ifYou": 83.2, "thinkGrowth": 85.0, "journey": 87.2, "fahad2": 90.4, "final": 91.6, "end": 98.5};
        const T0 = 64.9, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s10-system"]';
        const $ = (s) => document.querySelector(scope + ' ' + s);
        const $$ = (s) => Array.from(document.querySelectorAll(scope + ' ' + s));
        const rise = (sel, t, d) => tl.fromTo(sel, { yPercent: 125 }, { yPercent: 0, duration: d || 0.5, ease: "expo.out" }, at(t));
        const fadeUp = (sel, t, d) => tl.fromTo(sel, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: d || 0.45, ease: "power3.out" }, at(t));
        const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: d || 0.45, ease: "back.out(1.5)" }, at(t));
        const fadeOut = (sel, t, d) => tl.to(sel, { opacity: 0, duration: d || 0.3, ease: "power2.in" }, at(t));
        const dash = (el) => { const l = el.getTotalLength(); el.style.strokeDasharray = l; el.style.strokeDashoffset = l; return l; };
        const draw = (el, t, d) => { const l = dash(el); tl.fromTo(el, { strokeDashoffset: l }, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, at(t)); };
        const line = (svg, d, stroke, w) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke || 'rgba(114,0,19,0.35)');
          p.setAttribute('stroke-width', w || 3); p.setAttribute('stroke-linecap', 'round'); svg.appendChild(p); return p;
        };
        const pulse = (svg, d, t, until, w) => {
          const p = line(svg, d, '#80011F', w || 6); const len = p.getTotalLength(); p.style.strokeDasharray = `22 ${len}`;
          const n = Math.max(1, Math.floor((until - t) / 0.9));
          tl.fromTo(p, { strokeDashoffset: 22 }, { strokeDashoffset: -len, duration: 0.9, ease: "none", repeat: n - 1 }, at(t));
          return p;
        };

        const svg = $('#orb');
        const FL = [["STRATEGY", "strategy"], ["ACQUISITION", "users"], ["CONVERSION", "target"], ["CRM", "crm"], ["RETENTION", "star"], ["REVENUE", "revenue"]];
        const nodes = FL.map(([l, ic], k) => K.putC($('#flow'), K.node(l, ic, k === 5 ? "hot" : ""), 540, 470 + k * 165));
        const orbit = line(svg, "M540 395 C 900 395, 960 700, 960 880 C 960 1100, 900 1385, 540 1385 C 180 1385, 120 1100, 120 880 C 120 700, 180 395, 540 395 Z", 'rgba(114,0,19,0.18)', 2);
        rise("#t1", C.growthSystem - 0.1);
        nodes.forEach((n, k) => {
          tl.fromTo(n, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at(C.growthSystem + 0.1) + k * 0.22);
          if (k < 5) draw(line(svg, `M540 ${514 + k * 165} V ${591 + k * 165}`, 'rgba(114,0,19,0.45)', 3), C.growthSystem + 0.25 + k * 0.22, 0.2);
        });
        draw(orbit, C.growthSystem + 0.4, 1.2);
        // subtle data signals circulating around the system — held longer than usual
        [0, 1, 2].forEach((k) => {
          const p = line(svg, "M540 395 C 900 395, 960 700, 960 880 C 960 1100, 900 1385, 540 1385 C 180 1385, 120 1100, 120 880 C 120 700, 180 395, 540 395 Z", '#80011F', 6);
          const len = p.getTotalLength(); p.style.strokeDasharray = `26 ${len}`;
          const dur = 3.2, from = C.growthSystem + 1.4 + k * (dur / 3);
          const n = Math.max(1, Math.floor((C.reStudy - 0.4 - from) / dur));
          tl.fromTo(p, { strokeDashoffset: 26 }, { strokeDashoffset: -len, duration: dur, ease: "none", repeat: n - 1 }, at(from));
        });

        window.__timelines["s10-system"] = tl;
      </script>
    </template>
  </body>
</html>
