<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }

        #ttl { top: 330px; }
        .fc { position: absolute; top: 700px; width: 380px; height: 330px; border-radius: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
          background: #720013; color: #FBFCEB; box-shadow: 0 30px 80px rgba(114,0,19,0.28); }
        .fc .ic { stroke: #FBFCEB; }
        .fc b { font-size: 38px; font-weight: 800; letter-spacing: 0.04em; line-height: 1.1; }
        #wide { left: 70px; top: 470px; width: 940px; height: 790px; border-radius: 46%; border: 3px dashed rgba(128,1,31,0.45); }
        #svc { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 1225px; }

      </style>
      <div id="root" data-composition-id="s11-market" data-width="1080" data-height="1920">

        <div id="ttl" class="center lab" data-layout-allow-overlap>PRIMARY FOCUS</div>
        <div id="wide" class="ring"></div>
        <div id="f1" class="fc" style="left:130px"><span id="fi1"></span><b data-layout-allow-overlap>REAL<br>ESTATE</b></div>
        <div id="f2" class="fc" style="left:570px"><span id="fi2"></span><b data-layout-allow-overlap>STUDY<br>ABROAD</b></div>
        <div id="svc"><div class="pill" data-layout-allow-overlap><span id="si"></span>SERVICE BUSINESSES</div></div>
        <div id="dots"></div>

      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const K = window.KIT;
        const C = {"notAds": 2.1, "growth": 4.2, "strategy": 6.8, "audience": 7.9, "creative": 8.95, "data": 9.85, "funnel": 10.68, "decision": 13.2, "fahad": 15.05, "years": 16.55, "realEstate": 17.9, "studyAbroad": 18.66, "localIntl": 20.8, "service": 22.2, "brands": 26.2, "inhouse": 28.45, "agency": 29.3, "environment": 30.8, "focus": 34.25, "leadGen": 36.1, "dekhte": 38.04, "source": 38.92, "valuable": 40.4, "leakage": 43.2, "improve": 44.2, "revenue": 48.65, "campaign": 51.5, "business": 53.3, "notTrue": 54.95, "today": 56.7, "dataDriven": 58.9, "aiPowered": 59.78, "connected": 60.9, "advertising": 62.0, "marketing": 63.0, "growthSystem": 65.05, "reStudy": 68.2, "service2": 71.5, "platform": 75.2, "metaAds": 77.95, "googleAds": 78.83, "ai": 79.67, "automation": 80.3, "funnel2": 81.19, "data2": 81.79, "bizGrowth": 82.67, "experience": 83.87, "ifYou": 87.15, "thinkGrowth": 89.3, "journey": 91.4, "fahad2": 93.65, "final": 95.4, "end": 98.508};
        const T0 = 67.85, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s11-market"]';
        const $ = (s) => document.querySelector(scope + ' ' + s);
        const $$ = (s) => Array.from(document.querySelectorAll(scope + ' ' + s));
        const rise = (sel, t, d) => tl.fromTo(sel, { yPercent: 125 }, { yPercent: 0, duration: d || 0.5, ease: "expo.out" }, at(t));
        const fadeUp = (sel, t, d) => tl.fromTo(sel, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: d || 0.45, ease: "power3.out" }, at(t));
        const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: d || 0.45, ease: "back.out(1.5)" }, at(t));
        const fadeOut = (sel, t, d) => tl.to(sel, { opacity: 0, duration: d || 0.3, ease: "power2.in" }, at(t));
        const dash = (el) => { const l = el.getTotalLength(); el.style.strokeDasharray = l; el.style.strokeDashoffset = l; return l; };
        const draw = (el, t, d) => { const l = dash(el); tl.fromTo(el, { strokeDashoffset: l }, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, at(t)); };
        const line = (svg, d, stroke, w) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke || 'rgba(114,0,19,0.35)');
          p.setAttribute('stroke-width', w || 3); p.setAttribute('stroke-linecap', 'round'); svg.appendChild(p); return p;
        };
        const pulse = (svg, d, t, until, w) => {
          const p = line(svg, d, '#80011F', w || 6); const len = p.getTotalLength(); p.style.strokeDasharray = `22 ${len}`;
          const n = Math.max(1, Math.floor((until - t) / 0.9));
          tl.fromTo(p, { strokeDashoffset: 22 }, { strokeDashoffset: -len, duration: 0.9, ease: "none", repeat: n - 1 }, at(t));
          return p;
        };

        $('#fi1').outerHTML = K.icon("building", 96); $('#fi2').outerHTML = K.icon("grad", 96); $('#si').outerHTML = K.icon("nodes", 30);
        fadeUp("#ttl", C.reStudy - 0.1);
        pop("#f1", C.reStudy, 0.5);
        pop("#f2", C.reStudy + 0.9, 0.5);
        // a wider ring opens around them: broader service businesses
        tl.fromTo("#wide", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, at(C.service2 - 0.1));
        fadeUp("#svc", C.service2 + 0.4);
        const D = [[120, 640], [960, 640], [120, 1100], [960, 1100], [540, 470]];
        const dots = D.map(([x, y]) => K.putC($('#dots'), `<div style="width:30px;height:30px;border-radius:50%;background:#FBFCEB;border:5px solid #80011F"></div>`, x, y));
        tl.fromTo(dots, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.1 }, at(C.service2 + 0.6));

        window.__timelines["s11-market"] = tl;
      </script>
    </template>
  </body>
</html>
