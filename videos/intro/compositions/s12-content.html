<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }

        #ttl { top: 270px; }
        #me { position: absolute; left: 420px; top: 820px; width: 240px; height: 240px; border-radius: 50%; overflow: hidden; border: 6px solid #720013; box-shadow: 0 30px 70px rgba(114,0,19,0.25); }
        #me img { width: 100%; height: 133%; object-fit: cover; object-position: 50% 12%; }
        #mel { position: absolute; left: 0; right: 0; top: 1075px; text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 0.14em; color: #720013; }
        #orb { position: absolute; left: 0; top: 0; }
        #sub { top: 1500px; }

      </style>
      <div id="root" data-composition-id="s12-content" data-width="1080" data-height="1920">

        <div id="ttl" class="center lab" data-layout-allow-overlap>ON THIS PLATFORM</div>
        <svg id="orb" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="me"><img src="assets/fahad.jpg" alt="Fahad" /></div>
        <div id="mel" data-layout-allow-overlap>FAHAD</div>
        <div id="topics"></div>
        <div id="sub" class="center lab" data-layout-allow-overlap>EXPERIENCE · ANALYSIS · PRACTICAL THINKING</div>

      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const K = window.KIT;
        const C = {"notAds": 2.1, "growth": 4.2, "strategy": 6.8, "audience": 7.9, "creative": 8.95, "data": 9.85, "funnel": 10.68, "decision": 13.2, "fahad": 15.05, "years": 16.55, "realEstate": 17.9, "studyAbroad": 18.66, "localIntl": 20.8, "service": 22.2, "brands": 26.2, "inhouse": 28.45, "agency": 29.3, "environment": 30.8, "focus": 34.25, "leadGen": 36.1, "dekhte": 38.04, "source": 38.92, "valuable": 40.4, "leakage": 43.2, "improve": 44.2, "revenue": 48.65, "campaign": 51.5, "business": 53.3, "notTrue": 54.95, "today": 56.7, "dataDriven": 58.9, "aiPowered": 59.78, "connected": 60.9, "advertising": 62.0, "marketing": 63.0, "growthSystem": 65.05, "reStudy": 68.2, "service2": 71.5, "platform": 75.2, "metaAds": 77.95, "googleAds": 78.83, "ai": 79.67, "automation": 80.3, "funnel2": 81.19, "data2": 81.79, "bizGrowth": 82.67, "experience": 83.87, "ifYou": 87.15, "thinkGrowth": 89.3, "journey": 91.4, "fahad2": 93.65, "final": 95.4, "end": 98.508};
        const T0 = 74.85, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s12-content"]';
        const $ = (s) => document.querySelector(scope + ' ' + s);
        const $$ = (s) => Array.from(document.querySelectorAll(scope + ' ' + s));
        const rise = (sel, t, d) => tl.fromTo(sel, { yPercent: 125 }, { yPercent: 0, duration: d || 0.5, ease: "expo.out" }, at(t));
        const fadeUp = (sel, t, d) => tl.fromTo(sel, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: d || 0.45, ease: "power3.out" }, at(t));
        const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: d || 0.45, ease: "back.out(1.5)" }, at(t));
        const fadeOut = (sel, t, d) => tl.to(sel, { opacity: 0, duration: d || 0.3, ease: "power2.in" }, at(t));
        const dash = (el) => { const l = el.getTotalLength(); el.style.strokeDasharray = l; el.style.strokeDashoffset = l; return l; };
        const draw = (el, t, d) => { const l = dash(el); tl.fromTo(el, { strokeDashoffset: l }, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, at(t)); };
        const line = (svg, d, stroke, w) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke || 'rgba(114,0,19,0.35)');
          p.setAttribute('stroke-width', w || 3); p.setAttribute('stroke-linecap', 'round'); svg.appendChild(p); return p;
        };
        const pulse = (svg, d, t, until, w) => {
          const p = line(svg, d, '#80011F', w || 6); const len = p.getTotalLength(); p.style.strokeDasharray = `22 ${len}`;
          const n = Math.max(1, Math.floor((until - t) / 0.9));
          tl.fromTo(p, { strokeDashoffset: 22 }, { strokeDashoffset: -len, duration: 0.9, ease: "none", repeat: n - 1 }, at(t));
          return p;
        };

        const svg = $('#orb');
        const ring = line(svg, "M540 440 A 360 500 0 1 1 539.9 440 Z", 'rgba(114,0,19,0.18)', 2);
        const TP = [["META ADS", "ads", "metaAds"], ["GOOGLE ADS", "search", "googleAds"], ["AI", "ai", "ai"], ["AUTOMATION", "gear", "automation"], ["FUNNEL", "funnel", "funnel2"], ["DATA", "db", "data2"], ["BUSINESS GROWTH", "growth", "bizGrowth"]];
        const cx = 540, cy = 940, rx = 330, ry = 480;
        const base = TP.map((_, k) => -Math.PI / 2 + k * (2 * Math.PI / TP.length));
        const tops = TP.map(([l, ic], k) => K.putC($('#topics'), K.node(l, ic, k === 6 ? "hot sm" : "sm"), cx + Math.cos(base[k]) * rx, cy + Math.sin(base[k]) * ry));
        fadeUp("#ttl", C.platform);
        pop("#me", C.platform + 0.2, 0.55);
        fadeUp("#mel", C.platform + 0.4);
        draw(ring, C.platform + 0.5, 1.2);
        // each topic card enters as it is named
        TP.forEach(([, , cue], k) => pop(tops[k], C[cue] - 0.08, 0.35));
        // the ecosystem slowly rotates around Fahad (seek-safe: positions derive from one tweened angle)
        const rot = { a: 0 };
        tl.to(rot, { a: 0.55, duration: Math.max(1, C.ifYou - 0.4 - C.bizGrowth), ease: "sine.inOut",
          onUpdate: () => tops.forEach((t, k) => { gsap.set(t, { left: cx + Math.cos(base[k] + rot.a) * rx, top: cy + Math.sin(base[k] + rot.a) * ry }); }) }, at(C.bizGrowth));
        fadeUp("#sub", C.experience);

        window.__timelines["s12-content"] = tl;
      </script>
    </template>
  </body>
</html>
