<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }

        #ttl { top: 270px; }
        .big { position: absolute; top: 360px; width: 280px; height: 250px; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
        .big b { font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1.1; }
        #wires { position: absolute; left: 0; top: 0; }
        .rowl { position: absolute; left: 70px; }

      </style>
      <div id="root" data-composition-id="s08-modern" data-width="1080" data-height="1920">

        <div id="ttl" class="center lab" data-layout-allow-overlap>TODAY'S DIGITAL MARKETING</div>
        <svg id="wires" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="b1" class="big glass" style="left:80px"><span id="i1"></span><b data-layout-allow-overlap>DATA</b></div>
        <div id="b2" class="big glass" style="left:400px"><span id="i2"></span><b data-layout-allow-overlap>AI</b></div>
        <div id="b3" class="big glass" style="left:720px"><span id="i3"></span><b data-layout-allow-overlap>CONNECTED<br>SYSTEMS</b></div>
        <div id="eco"></div>

      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const K = window.KIT;
        const C = {"notAds": 2.1, "growth": 4.2, "strategy": 6.8, "audience": 7.9, "creative": 8.95, "data": 9.85, "funnel": 10.68, "decision": 13.2, "fahad": 15.05, "years": 16.55, "realEstate": 17.9, "studyAbroad": 18.66, "localIntl": 20.8, "service": 22.2, "brands": 26.2, "inhouse": 28.45, "agency": 29.3, "environment": 30.8, "focus": 34.25, "leadGen": 36.1, "dekhte": 38.04, "source": 38.92, "valuable": 40.4, "leakage": 43.2, "improve": 44.2, "revenue": 48.65, "campaign": 51.5, "business": 53.3, "notTrue": 54.95, "today": 56.7, "dataDriven": 58.9, "aiPowered": 59.78, "connected": 60.9, "advertising": 62.0, "marketing": 63.0, "growthSystem": 65.05, "reStudy": 68.2, "service2": 71.5, "platform": 75.2, "metaAds": 77.95, "googleAds": 78.83, "ai": 79.67, "automation": 80.3, "funnel2": 81.19, "data2": 81.79, "bizGrowth": 82.67, "experience": 83.87, "ifYou": 87.15, "thinkGrowth": 89.3, "journey": 91.4, "fahad2": 93.65, "final": 95.4, "end": 98.508};
        const T0 = 56.35, at = (g) => +(g - T0).toFixed(3);
        const scope = '[data-composition-id="s08-modern"]';
        const $ = (s) => document.querySelector(scope + ' ' + s);
        const $$ = (s) => Array.from(document.querySelectorAll(scope + ' ' + s));
        const rise = (sel, t, d) => tl.fromTo(sel, { yPercent: 125 }, { yPercent: 0, duration: d || 0.5, ease: "expo.out" }, at(t));
        const fadeUp = (sel, t, d) => tl.fromTo(sel, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: d || 0.45, ease: "power3.out" }, at(t));
        const pop = (sel, t, d) => tl.fromTo(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: d || 0.45, ease: "back.out(1.5)" }, at(t));
        const fadeOut = (sel, t, d) => tl.to(sel, { opacity: 0, duration: d || 0.3, ease: "power2.in" }, at(t));
        const dash = (el) => { const l = el.getTotalLength(); el.style.strokeDasharray = l; el.style.strokeDashoffset = l; return l; };
        const draw = (el, t, d) => { const l = dash(el); tl.fromTo(el, { strokeDashoffset: l }, { strokeDashoffset: 0, duration: d || 0.6, ease: "power2.inOut" }, at(t)); };
        const line = (svg, d, stroke, w) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke || 'rgba(114,0,19,0.35)');
          p.setAttribute('stroke-width', w || 3); p.setAttribute('stroke-linecap', 'round'); svg.appendChild(p); return p;
        };
        const pulse = (svg, d, t, until, w) => {
          const p = line(svg, d, '#80011F', w || 6); const len = p.getTotalLength(); p.style.strokeDasharray = `22 ${len}`;
          const n = Math.max(1, Math.floor((until - t) / 0.9));
          tl.fromTo(p, { strokeDashoffset: 22 }, { strokeDashoffset: -len, duration: 0.9, ease: "none", repeat: n - 1 }, at(t));
          return p;
        };

        $('#i1').outerHTML = K.icon("db", 80); $('#i2').outerHTML = K.icon("ai", 80); $('#i3').outerHTML = K.icon("nodes", 80);
        const svg = $('#wires');
        fadeUp("#ttl", C.today);
        pop("#b1", C.dataDriven - 0.08); pop("#b2", C.aiPowered - 0.08); pop("#b3", C.connected - 0.08);
        draw(line(svg, "M360 485 H 400", '#80011F', 4), C.aiPowered + 0.1, 0.25);
        draw(line(svg, "M680 485 H 720", '#80011F', 4), C.connected + 0.1, 0.25);
        // a subtle ecosystem: two acquisition paths → one growth outcome (no platform logos)
        const F = ["WEBSITE", "CRM", "CUSTOMER", "REVENUE"];
        const rows = [["META", 760], ["GOOGLE", 960]];
        const t0 = C.today + 0.15;
        rows.forEach(([src, y], r) => {
          const xs = [140, 320, 500, 690, 880];
          const items = [src, ...F].map((l, k) => K.putC($('#eco'), K.node(l, null, "sm" + (k === 0 ? " hot" : "")), xs[k], y));
          items.forEach((n, k) => {
            tl.fromTo(n, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, at(t0) + r * 0.25 + k * 0.12);
          });
          [0, 1, 2, 3].forEach((k) => draw(line(svg, `M${xs[k] + 70} ${y} H ${xs[k + 1] - 75}`, 'rgba(114,0,19,0.4)', 3), t0 + r * 0.25 + k * 0.12 + 0.15, 0.2));
          pulse(svg, `M140 ${y} H 880`, t0 + 0.9 + r * 0.3, C.advertising - 0.4, 6);
        });
        const g = K.putC($('#eco'), K.node("GROWTH", "growth", "hot"), 540, 1220);
        draw(line(svg, "M880 800 C 880 1100, 700 1220, 640 1220", '#80011F', 4), t0 + 0.9, 0.5);
        draw(line(svg, "M880 1000 C 870 1150, 720 1220, 640 1220", '#80011F', 4), t0 + 1.0, 0.5);
        pop(g, t0 + 1.3, 0.45);

        window.__timelines["s08-modern"] = tl;
      </script>
    </template>
  </body>
</html>
